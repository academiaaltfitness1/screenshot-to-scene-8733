name: Henry local agent tests
on:
  push:
    paths:
      - "agent-henry/**"
  pull_request:
    paths:
      - "agent-henry/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: agent-henry
